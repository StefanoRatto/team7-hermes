name: team7
description: team7 — bronze gold, electric cyan, and ocean blue

colors:
  background: "#0a0a14"

  # Banner colors
  banner_border: "#00d9ff"
  banner_title: "#a57c00"
  banner_accent: "#00d9ff"
  banner_dim: "#006880"
  banner_text: "#00d9ff"

  # UI colors
  ui_accent: "#00d9ff"
  ui_label: "#a57c00"
  ui_ok: "#4caf50"
  ui_error: "#ef5350"
  ui_warn: "#ffa726"
  ui_tool: "#a57c00"
  ui_thinking: "#006880"

  # Diff — matched to reference screenshot (2026-09-25): dark green/red bands + tinted text
  diff_added: "#152919"
  diff_removed: "#351719"
  diff_added_word: "#98e491"
  diff_removed_word: "#f1a299"

  # Syntax — One Dark Pro inspired for readability on dark backgrounds
  syntax_string: "#98c379"
  syntax_number: "#d19a66"
  syntax_keyword: "#c678dd"
  syntax_comment: "#5c6370"

  # Prompt & rules
  prompt: "#a57c00"
  input_rule: "#00d9ff"
  response_border: "#a57c00"

  # Status bar
  status_bar_bg: "#060610"
  status_bar_text: "#00b0f0"
  status_bar_strong: "#00d9ff"
  status_bar_dim: "#006880"
  status_bar_good: "#8FBC8F"
  status_bar_warn: "#a57c00"
  status_bar_bad: "#FF8C00"
  status_bar_critical: "#FF6B6B"

  # Session
  session_label: "#a57c00"
  session_border: "#006880"

  # Completion & selection
  completion_menu_bg: "#060610"
  completion_menu_current_bg: "#0d1f2b"
  selection_bg: "#0d1f2b"
  shell_dollar: "#00d9ff"
  voice_status_bg: "#060610"

# Paired polarity blocks — force the same dark diff tokens regardless of terminal polarity
dark_colors:
  diff_added: "#152919"
  diff_removed: "#351719"
  diff_added_word: "#98e491"
  diff_removed_word: "#f1a299"

light_colors:
  diff_added: "#152919"
  diff_removed: "#351719"
  diff_added_word: "#98e491"
  diff_removed_word: "#f1a299"

branding:
  agent_name: "team7 on Hermes Agent"
  welcome: "team7 online. Type your message or /help for commands."
  goodbye: "team7 signing off."
  response_label: " team7 "
  prompt_symbol: "❯"
  help_header: " team7 Commands"

tool_prefix: "┊"

# team7 ASCII art — one color per line + empty line below
banner_hero: |-
  [#a57c00]████████ ███████   ███   ███    ███ ███████[/]
  [#a57c00]   ██             ██ ██  ████  ████      ██[/]
  [#a57c00]   ██    █████   ██   ██ ██ ████ ██    ██[/]
  [#a57c00]   ██            ██   ██ ██  ██  ██   ██[/]
  [#a57c00]   ██    ███████ ███████ ██      ██  ██[/]
  [#a57c00] [/]

# Suppress the top HERMES AGENT banner — single space is truthy (won't fallback to default) but renders invisibly
banner_logo: " "
